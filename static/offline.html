<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sem conexão • Marlon Myaggy</title>
<link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;
       background:radial-gradient(circle at 30% 20%,#0b3d2f 0,#06231b 55%,#04140f 100%);color:#f6f1e4;text-align:center;padding:24px;box-sizing:border-box}
  img{width:112px;height:112px;border-radius:26px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  h1{margin:22px 0 8px;font-size:1.5rem;font-family:Lora,Georgia,serif} p{margin:0 auto 22px;max-width:32ch;color:rgba(246,241,228,.75);line-height:1.5}
  button{background:linear-gradient(135deg,#f3dc98,#d9b45a 45%,#b8913e);color:#10241b;border:0;border-radius:10px;padding:.8rem 1.4rem;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
  <main>
    <img src="/static/icons/icon-192.png" alt="">
    <h1>Você está sem internet</h1>
    <p>As páginas que você já visitou continuam disponíveis. Assim que a conexão voltar, tudo é atualizado.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
